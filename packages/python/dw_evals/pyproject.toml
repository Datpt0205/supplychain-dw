[project]
name = "dw-evals"
version = "0.1.0"
description = "Evaluation: versioned dataset schema, graders and regression runner"
requires-python = ">=3.12"
dependencies = [
    "dw-kernel",
    "dw-platform",
    "dw-agent-runtime",
    "dw-knowledge",
    "dw-memory",
    "dw-connectors",
    # Graded because the rules live in its code, not in its prompts: which URL
    # may become an account's portal, and when a compiled recipe is trustworthy.
    "pydantic>=2.10,<3",
    "pyyaml>=6.0,<7",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dw_evals"]
