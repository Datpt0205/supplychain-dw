[project]
name = "dw-knowledge"
version = "0.1.0"
description = "Knowledge: ingestion, retrieval gateway with trusted tenant/ACL filter injection, evidence contracts"
requires-python = ">=3.12"
dependencies = [
    "dw-kernel",
    "dw-platform",
    "dw-observability",
    "pydantic>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "qdrant-client>=1.12,<1.15",
    "minio>=7.2,<8",
    "httpx>=0.27,<0.29",
    "pyyaml>=6,<7",
    # In-process text of the office files a case document may be
    # (supply-chain ADR 0021 amended 2026-10-09): read here, so the text can be
    # redacted before any model sees it. python-docx and openpyxl pinned to
    # match apps/docgen, which already owns them.
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
# Heavy multi-format parsing + OCR stack (torch, layout + OCR models). Installed
# ONLY in the worker image where ingestion runs — never in the API image.
parsers = [
    # Docling reads images and scanned PDFs in process
    # (`adapters.docling_ocr`, supply-chain ticket ai-automation/21): layout and
    # reading order, with EasyOCR as its OCR engine. Docling's default engine,
    # RapidOCR, cannot write Vietnamese tone marks (its dictionaries lack 88 of
    # 120 toned vowels); EasyOCR's `latin_g2` recogniser can (96-98% of toned
    # words on a clean page). Both Apache-2.0/MIT. Their weights are baked into
    # the worker image, never downloaded at run time when deployed.
    "docling>=2.15,<3",
    "easyocr>=1.7.2,<2",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dw_knowledge"]
