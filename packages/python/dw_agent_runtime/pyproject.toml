[project]
name = "dw-agent-runtime"
version = "0.1.0"
description = "Agent runtime: worker/tool contracts, workflow runner port, model gateway (adapters arrive in phase 2)"
requires-python = ">=3.12"
dependencies = [
    "dw-kernel",
    "dw-platform",
    "dw-observability",
    "pydantic>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    # Directly, for the one LISTEN connection run_events holds: a listening
    # connection never returns to a pool, so it cannot come from SQLAlchemy.
    "asyncpg>=0.30,<1",
    "langgraph>=0.6,<2",
    # The sandbox backend implements deepagents' own `BaseSandbox`, so the
    # model sees the tool set it already knows rather than a bespoke one.
    "deepagents>=0.7,<1",
    "langchain-core>=1,<2",
    "httpx>=0.28,<1",
    "pyyaml>=6.0,<7",
    "langchain-openai>=1,<2",
    "langchain>=1,<2",
    # Versioned document templates rendered in process (doc_templates,
    # supply-chain ticket ai-automation/03). Pinned to match apps/docgen and
    # dw_knowledge, which already own it.
    "python-docx>=1.1,<2",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dw_agent_runtime"]
