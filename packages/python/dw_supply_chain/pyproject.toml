[project]
name = "dw-supply-chain"
version = "0.1.0"
description = "Supply Chain bounded context"
requires-python = ">=3.12"
dependencies = [
    "dw-kernel",
    "dw-platform",
    "dw-agent-runtime",
    # Pinned to match the packages that already own these: `apps/api` for
    # FastAPI and `dw_agent_runtime` for LangGraph. A context that picked its own
    # range would be a second opinion about one fact, and uv would refuse the
    # workspace the first time the two disagreed.
    "fastapi>=0.115,<1",
    "langgraph>=0.6,<2",
    "pydantic>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    # Pinned to match dw_platform, which already owns policy-file loading
    # (retention_policy.py) — same reasoning as fastapi/langgraph above.
    "pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dw_supply_chain"]
