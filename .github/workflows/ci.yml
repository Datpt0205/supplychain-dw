name: CI

# The 10 mandatory stages. Fast static jobs run in parallel; docker-heavy jobs
# (integration, compose smoke) gate the end.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. config / contract validation ------------------------------------------
  contracts:
    name: Config · contract · manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.31"
          enable-cache: true
      - name: Sync workspace
        run: uv sync --all-packages
      - name: OpenAPI snapshot is current
        run: uv run python scripts/generate_contracts.py --check
      - name: Release manifest is current
        run: uv run python scripts/release_manifest.py --check
      - name: Compose profiles validate
        run: |
          cp .env.example .env
          docker compose --env-file .env -f infra/compose/docker-compose.yml --profile infra config -q
          docker compose --env-file .env -f infra/compose/docker-compose.yml --profile full config -q
          docker compose --env-file .env -f infra/compose/docker-compose.yml --profile full --profile observability config -q
          # Shared dev-server override (docs/runbooks/shared-dev-server.md);
          # the vars are `:?`-required by the override itself (interpolation is
          # file-wide, so they are needed even before profile filtering).
          QDRANT_API_KEY=ci REDIS_PASSWORD=ci KC_PUBLIC_HOSTNAME=http://localhost:8686 \
          DW_KEYCLOAK_ISSUER=http://localhost:8686/realms/dw \
          DW_PUBLIC_WEB_URL=http://localhost:23000 \
          NEXT_PUBLIC_API_BASE_URL=http://localhost:28000 \
            docker compose --env-file .env -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.dev.yml --profile full config -q

  # 2, 4, 5, 8. python quality + unit + architecture + eval smoke -------------
  python-quality:
    name: Python lint · typecheck · unit · architecture · eval smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.31"
          enable-cache: true
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: Hygiene (added lines only)
        run: uv run python scripts/check_hygiene.py --base origin/${{ github.base_ref || 'main' }}
      - name: "Unit tests (coverage gate: fail_under in pyproject)"
        run: uv run pytest -m unit --cov --cov-report=term --cov-report=xml
      - name: Repository invariants (RLS, unread fields, unhandled literals)
        run: uv run python scripts/verify_invariants.py
      - name: Coding-agent harness hooks (commit gate, session baseline)
        run: bash scripts/test_claude_hooks.sh
      - name: Architecture tests
        run: |
          uv run lint-imports
          uv run python scripts/verify_architecture.py
      - name: Migration chain is linear (single alembic head, no reused ids)
        # Two PRs numbering migrations in parallel -> two heads -> the migrate
        # one-shot dies on the server. Catch it at PR time instead.
        #
        # Counting heads alone is not enough. When the two chains reuse the same
        # ids - which is what a rebase onto a branch that numbered in parallel
        # produces - alembic reports one head and warns "present more than once",
        # then walks an ambiguous graph: `upgrade head` records revisions whose
        # DDL never ran. So the warning is an error here too.
        run: |
          OUT=$(uv run alembic -c db/alembic.ini heads 2>&1)
          HEADS=$(echo "$OUT" | grep -c "(head)")
          [ "$HEADS" = "1" ] || { echo "::error::alembic has $HEADS heads - renumber the newer chain"; exit 1; }
          echo "$OUT" | grep -q "present more than once" && {
            echo "::error::alembic revision ids are reused - renumber the newer chain"
            echo "$OUT" | grep "present more than once"
            exit 1
          }
          exit 0
      - name: Eval smoke suite
        run: uv run python scripts/run_evals.py --smoke

  # 3. frontend quality -------------------------------------------------------
  scaffold-smoke:
    # The skeleton's central claim is that a product can plug a bounded context
    # in and inherit everything. Nothing tested that claim: this repo ships no
    # context on purpose, so the fifteen seams `scripts/new_context.py` wires
    # had never been walked end to end. Walking them found one the documented
    # list missed — `apps/api/pyproject.toml` — which is what a claim nobody
    # executes looks like. A throwaway context, generated and discarded on every
    # push, is what makes the claim fail loudly when a seam moves.
    name: A generated bounded context still plugs in
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.31"
          enable-cache: true
      # Two, because every product has at least one context before it adds the
      # next: a second context is where anchors on the last list entry and
      # clashing test module names show up, and one alone passes both.
      - name: Scaffold two contexts
        run: |
          uv run python scripts/new_context.py --name smoke_ctx
          uv run python scripts/new_context.py --name smoke_two
      - name: The workspace still resolves
        run: uv sync --all-packages
      - name: It passes the gates the platform holds itself to
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run lint-imports
          uv run python scripts/verify_architecture.py
          uv run python scripts/verify_invariants.py
      - name: Its slice passes, and nothing else broke
        run: uv run pytest -m unit -q
      # No cleanup: the checkout is disposable, and a cleanup step that failed
      # would leave a green build hiding a scaffold that cannot be undone.

  frontend-quality:
    name: Frontend lint · typecheck · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generated API client is current
        run: |
          pnpm run generate:api-types
          # Staging first: types are split per context, so a stale checkout can
          # also mean a missing or orphaned file, which `git diff` alone misses.
          git add -A packages/typescript/api-client/src/generated
          git diff --cached --exit-code packages/typescript/api-client/src/generated
      - name: Prettier check
        run: pnpm run format:check
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build web
        run: pnpm --filter @dw/web build

  # 7. security / dependency scan --------------------------------------------
  security-scan:
    name: Security · dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history
      - name: gitleaks (secret scan, full history)
        # The CLI rather than gitleaks-action: the action calls the GitHub API
        # and so depends on token permissions, while the CLI scans the checked
        # out history directly and matches what runs locally.
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --no-banner --redact
          rm gitleaks
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.31"
          enable-cache: true
      - name: Sync workspace
        run: uv sync --all-packages
      - name: bandit (Python SAST, medium+)
        run: uvx --python 3.12 bandit@1.8.6 -r apps/api/src apps/docgen/src apps/worker/src packages/python/*/src -ll
      - name: pip-audit (Python dependencies)
        run: uv export --all-packages --no-emit-workspace --format requirements.txt > /tmp/requirements.txt && uvx pip-audit@2.9.0 -r /tmp/requirements.txt --disable-pip
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: pnpm audit (frontend, high+)
        run: pnpm install --frozen-lockfile && pnpm audit --audit-level high

  # 6. integration tests (real Postgres/Qdrant/Redis/S3) ----------------------
  integration:
    name: Integration · RLS · checkpoint · E2E slices
    runs-on: ubuntu-latest
    # Not `needs: python-quality`. Waiting on it put a minute of lint in front
    # of the longest job on the critical path, and lint failing says nothing
    # about whether the integration tests pass. `cancel-in-progress` already
    # stops the wasted runner when a newer push lands.
    needs: [contracts]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Prebuild the sandbox image (cached)
        # The slowest image in the repo by a distance: LibreOffice, pandoc and a
        # PDF toolchain out of apt, rebuilt from scratch every run because a
        # fresh runner shares no layer cache with the last one. Built here
        # against the GitHub cache and loaded under the tag compose expects, so
        # the `up` below — which passes no `--build` — finds it and builds
        # nothing.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/docgen.Dockerfile
          tags: dw-docgen:local
          load: true
          cache-from: type=gha,scope=docgen
          cache-to: type=gha,mode=max,scope=docgen
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.31"
          enable-cache: true
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Start infra profile
        # One-shot services (s3-setup) exit 0 by design, but `up --wait`
        # treats any exited container as failure — so wait only on the
        # long-running services the tests actually need.
        run: |
          cp .env.example .env
          docker compose --env-file .env -f infra/compose/docker-compose.yml --profile infra up -d
          docker compose --env-file .env -f infra/compose/docker-compose.yml --profile infra up -d --wait postgres qdrant valkey s3 keycloak docgen docgen-gateway
      - name: Integration tests
        # .env exported, as `make test-integration` does locally: some suites
        # read QDRANT_URL / DW_DOCGEN_URL from the environment, and this repo's
        # infra ports are not the defaults they fall back to.
        run: |
          set -a; . ./.env; set +a
          uv run pytest -m integration
      - name: E2E tests
        # Its own marker, so `-m integration` never collected it and the step
        # above only claimed to run it. Exit 5 is "no tests collected".
        run: |
          set -a; . ./.env; set +a
          uv run pytest -m e2e || test $? -eq 5
      - name: Stop infra
        if: always()
        run: docker compose --env-file .env -f infra/compose/docker-compose.yml --profile infra down -v

  # 9 + 10. container build + compose smoke ----------------------------------
  containers:
    name: Container build · compose smoke test
    runs-on: ubuntu-latest
    needs: [contracts]
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        # The full profile builds three images - api, worker and a Next.js
        # production build - on top of four pulled infra images. Measured: the
        # runner hit 0 MB free mid-build and `dw-api-1` exited 1, which reads as
        # an application failure and is not one. These toolchains are
        # preinstalled on ubuntu-latest and nothing here uses them.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/share/swift
          docker image prune -af
          df -h /
      - name: Build and start full profile
        # No --wait: migrate/s3-setup are one-shots that exit 0 and
        # would fail the wait; the curl retries below do the readiness gating.
        run: |
          cp .env.example .env
          docker compose --env-file .env -f infra/compose/docker-compose.yml --profile full up -d --build
      - name: "Smoke: API health"
        run: curl --fail --retry 40 --retry-delay 5 --retry-connrefused --retry-all-errors http://localhost:8000/api/v1/health
      - name: "Smoke: document sandbox health"
        # Through the gateway: the sandbox itself is on an internal network and
        # cannot publish a port, which is the property that makes it a sandbox.
        run: |
          set -a; . ./.env; set +a
          curl --fail --retry 40 --retry-delay 5 --retry-connrefused --retry-all-errors "http://localhost:${DW_DOCGEN_HOST_PORT}/health"
      - name: "Smoke: web responds"
        # --retry-all-errors: docker-proxy answers "connection reset" (exit 56)
        # before the container listens, which --retry-connrefused does not cover.
        run: curl --fail --retry 40 --retry-delay 5 --retry-connrefused --retry-all-errors -o /dev/null http://localhost:3000
      - name: trivy (image vulnerabilities, HIGH+ with a fix available)
        # Here rather than in the security job because this is where the images
        # already exist; building them twice to scan them costs four minutes.
        # `--ignore-unfixed`: a CVE with no released fix is not an action, and a
        # scanner that reports what cannot be done gets muted.
        env:
          # Pinned: a scanner that changes version on its own turns a red build
          # into a question about the scanner. Bump deliberately.
          TRIVY_VERSION: "0.74.0"
        run: |
          # --fail matters more than it looks. Without it curl pipes GitHub's
          # 404 page into tar, which reports "not in gzip format" — and the
          # first version pinned here did not exist, so this step never ran a
          # scan at all while reading as configured in the workflow file.
          curl --fail -sSL \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz trivy
          ./trivy --version
          for image in dw-api:local dw-worker:local dw-docgen:local dw-web:local; do
            echo "== $image"
            ./trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --exit-code 1 --quiet "$image"
          done
      - name: Container logs
        # Only the `ps` table was captured before, which says a container is
        # unhealthy and never why. Three runs were spent guessing at a startup
        # nobody could read.
        if: failure()
        run: |
          docker compose --env-file .env -f infra/compose/docker-compose.yml --profile full logs --no-color --tail 120 api worker docgen migrate
      - name: Container status
        if: always()
        run: docker compose --env-file .env -f infra/compose/docker-compose.yml --profile full ps
      - name: Tear down
        if: always()
        run: docker compose --env-file .env -f infra/compose/docker-compose.yml --profile full down -v
