[project]
name = "dw-api"
version = "0.1.0"
description = "API process: FastAPI composition root and presentation layer"
requires-python = ">=3.12"
dependencies = [
    "dw-kernel",
    "dw-platform",
    "dw-agent-runtime",
    "dw-knowledge",
    "dw-memory",
    "dw-supply-chain",
    "dw-connectors",
    "dw-observability",
    # Object storage for knowledge documents and feedback attachments
    # (bootstrap/storage.py) — backbone infra, not a business context's.
    "minio>=7.2,<8",
    "qdrant-client>=1.12,<1.15",
    # Ops hardening Phase 5: the redis readiness probe (dw_api/health.py)
    # imports the client directly for its type. Declared explicitly rather
    # than left to resolve transitively through dw-platform's cache adapter —
    # same reasoning as qdrant-client and prometheus-client just below.
    "redis>=5,<6",
    "fastapi>=0.115,<1",
    # Ops hardening Phase 5: mounts `/metrics` directly (dw_observability's
    # PrometheusMetricReader writes into this same package's global REGISTRY).
    # Declared explicitly rather than left to resolve transitively through
    # dw-observability's OTel exporter — dw-api imports it in its own source.
    "prometheus-client>=0.20,<1",
    "python-multipart>=0.0.18,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "httpx>=0.28,<1",
    "pyyaml>=6.0,<7",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dw_api"]
