# ===========================================================================
# Shared dev server override — the FULL stack runs on the server (api/worker/
# web built from source) AND the data plane is exposed so devs can also
# run `make dev` locally against the same Postgres/Qdrant/Valkey/MinIO/
# Keycloak.
#
# Usage on the server (deploy dir, .env filled per the runbook):
#   docker compose --project-name sales_dev_dw --env-file .env \
#     -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.dev.yml \
#     --profile full up -d --build
#
# Host ports are deliberately non-default — 5432/6379/8000/3000 are taken by
# other projects on the host (verify with `ss -tln`):
#   25432 postgres · 26333/26334 qdrant · 26379 valkey · 29000/29001 minio
#   28686 keycloak · 28000 api · 23000 web
#
# SECURITY — this binds real ports on a public IP. Non-negotiable before up:
#   1. Firewall allowlist: only team IPs may reach the ports above.
#   2. Strong unique passwords in the server .env (never the .env.example ones).
#   3. QDRANT_API_KEY / REDIS_PASSWORD / KC_PUBLIC_HOSTNAME / DW_KEYCLOAK_ISSUER
#      are REQUIRED here (`:?` fails fast).
# Demo/dev data only — this stack is not a production trust boundary.
# ===========================================================================
services:
  postgres:
    ports: !override
      - "0.0.0.0:25432:5432"

  qdrant:
    # Without an API key an exposed Qdrant is open to anyone the firewall lets
    # through; the key rides in the same header the SDK already sends.
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?}
    ports: !override
      - "0.0.0.0:26333:6333"
      - "0.0.0.0:26334:6334"

  valkey:
    # Same flags as the base file plus auth — `command` replaces wholesale, so
    # keep the base flags in sync if they change.
    command:
      [
        "valkey-server",
        "--maxmemory-policy",
        "noeviction",
        "--save",
        "60",
        "1",
        "--requirepass",
        "${REDIS_PASSWORD:?}",
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    healthcheck:
      # Base healthcheck pings unauthenticated, which NOAUTHs once requirepass
      # is on.
      test: ["CMD-SHELL", 'valkey-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
    ports: !override
      - "0.0.0.0:26379:6379"

  s3:
    ports: !override
      - "0.0.0.0:29000:8333"

  keycloak:
    environment:
      # Token `iss` must equal the URL devs' browsers/APIs use, else every
      # OIDC verify fails. Example: http://sales-dev.dxrank.vn:28686
      KC_HOSTNAME: ${KC_PUBLIC_HOSTNAME:?}
    ports: !override
      - "0.0.0.0:28686:8080"

  # ------------------------------------------------ app services (profile full)
  # The base file talks to valkey/qdrant over unauthenticated internal URLs;
  # with requirepass/API key enabled above, every in-container client needs the
  # credentials too — that is what the env overrides below are for.
  api:
    environment:
      QDRANT_API_KEY: ${QDRANT_API_KEY:?}
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@valkey:6379/0
      # Browser origin of the server-hosted web app (cross-origin: web :23000
      # calls api :28000). JSON list — pydantic parses list fields as JSON.
      DW_API_CORS_ORIGINS: '["${DW_PUBLIC_WEB_URL:?}"]'
    ports: !override
      - "0.0.0.0:28000:8000"

  worker:
    environment:
      QDRANT_API_KEY: ${QDRANT_API_KEY:?}
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@valkey:6379/0

  web:
    # NEXT_PUBLIC_* build args are interpolated from the server .env by the
    # base file; the runtime env below overrides the hardcoded localhost values
    # for SSR. API_INTERNAL_BASE_URL (http://api:8000) stays internal.
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?}
      NEXT_PUBLIC_CHAT_BASE_URL: ${NEXT_PUBLIC_CHAT_BASE_URL:?}
    ports: !override
      - "0.0.0.0:23000:3000"
