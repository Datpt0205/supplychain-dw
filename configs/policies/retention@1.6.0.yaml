schema_version: "1.0"
policy_id: retention
policy_version: "1.6.0"

# Dữ liệu sống bao lâu trước khi bị xoá hẳn.
#
# Vì sao là một artifact có version chứ không phải hằng số trong code: đây là
# câu trả lời cho một câu hỏi tuân thủ. Khi khách hỏi "các anh giữ dữ liệu của
# chúng tôi bao lâu", thứ đưa ra phải là một file có số hiệu, có lịch sử thay
# đổi trong git, và nằm trong release manifest — để trả lời được cả câu khó hơn:
# "hồi tháng Ba các anh giữ bao lâu".
#
# `memory.items.retention_policy` mang KHOÁ vào bảng này. Cột đó tồn tại từ đầu
# và trước bản này chưa ai đọc: mọi dòng ghi cứng "default" và không gì hết hạn
# bao giờ. Một cột vòng đời mà không có ai thực thi thì tệ hơn là không có, vì
# khi rà soát nó đọc như một cam kết.

# Xoá THẬT, không phải đóng cửa sổ hiệu lực. `valid_until` trả lời "điều này
# thôi còn đúng" — dùng cho supersession, và hàng vẫn nằm đó để giải thích một
# quyết định cũ. Retention trả lời một câu khác hẳn: "chúng tôi không còn được
# phép giữ điều này". Hai câu đó không được dùng chung một cơ chế, vì câu thứ
# hai là thứ người ta viết vào hợp đồng.
classes:
  # Mặc định cho mọi ký ức chưa khai lớp nào. Hai năm: đủ dài để một chu kỳ bán
  # hàng B2B (thường 6–18 tháng) khép lại mà agent vẫn nhớ đầu câu chuyện, đủ
  # ngắn để dữ liệu một khách đã rời đi không nằm lại vô hạn.
  default:
    days: 730
    description: Ký ức nghiệp vụ thông thường

  # Từ 1.5.0 chỉ còn `default`, vì đó là lớp duy nhất code gán được
  # (`dw_memory.service.RETENTION_CLASS`). Bản 1.4.0 còn khai `sensitive`
  # (365 ngày), `ephemeral` (30) và `legal_hold` (không hết hạn), nhưng không
  # đường ghi nào mang được chúng lên một dòng: một cam kết tuân thủ code không
  # giữ. Gán được thì phải có người quyết một ánh xạ (loại hay phân loại ký ức
  # → lớp) cho một đường ghi chưa có producer, nên gỡ là thay đổi trung thực.
  #
  # Một lớp quay lại CÙNG đường gán nó. `legal_hold` là quyết định của người,
  # nên nó quay lại cùng route để người đặt một lệnh giữ — không trước.
  # `test_the_pinned_retention_policy_promises_only_classes_code_can_assign`
  # đỏ nếu một lớp được khai ở đây mà code không gán.
  #
  # Dòng mang lớp không có ở đây vẫn được giữ và đếm, không bị đoán
  # (`dw_platform.retention_policy`): một dòng cũ mang `legal_hold` không bao
  # giờ bị quét. Không có CHECK cho cột này: tập giá trị thuộc file này.

# Vòng đời phía knowledge: tài liệu đã xoá, và trích dẫn đã mồ côi.
#
# Đánh dấu xoá là thao tác của người dùng và người dùng đổi ý. `deleted_grace_days`
# là thời gian để đổi ý; hết hạn thì tài liệu đi hẳn và các chunk theo sau
# (FK chunks -> documents là CASCADE).
#
# NHƯNG `evidence -> documents` là RESTRICT, và ràng buộc đó do trigger của
# Postgres kiểm, không đi qua RLS. Một tài liệu còn bất kỳ dòng evidence nào trỏ
# tới thì database từ chối xoá — đúng, vì xoá nó biến một trích dẫn thành lời nói
# suông. Nên lượt quét BỎ QUA những tài liệu đó và đếm lại, chứ không đâm vào lỗi
# rồi hỏng cả lô.
#
# Và đây là chỗ bản trước nói sai: evidence KHÔNG tự hết hạn. Xoá một ký ức chỉ
# cascade `memory.item_evidence`, dòng evidence ở lại vĩnh viễn — nên một tài liệu
# từng được trích dẫn một lần sẽ không bao giờ xoá được. `orphan_evidence_grace_days`
# là thứ làm chuỗi đó chảy: evidence không còn `item_evidence` nào trỏ tới thì
# không còn chứng minh cho cái gì nữa. Hôm nay evidence và item_evidence ghi trong
# cùng một transaction nên "không có link" là mồ côi thật; cửa sổ này để tính chất
# đó không phải thứ gánh cả cơ chế, phòng khi có người tách hai lệnh ghi ra.
knowledge:
  deleted_grace_days: 30
  orphan_evidence_grace_days: 7

# Bảng chuỗi thời gian: audit_events.
#
# model_usage_ledger từng đứng cạnh nó và đã bị bỏ hẳn (migration aefe7c1f5d9b)
# — repo không xuất hoá đơn cho ai, nên sổ chi phí model không có người đọc.
#
# Chúng phân mảnh theo tháng, nên retention ở đây là DROP PARTITION — tức thì,
# không để lại gì phải vacuum. Nhưng cũng vì thế mà nó KHÔNG lùi được: một
# partition bị drop là một tháng dữ liệu biến mất, không có bản soft-delete nào
# đứng giữa.
#
# Cho nên mặc định là `days: null` — quét vẫn TẠO partition trước (thuần lợi,
# không rủi ro) nhưng KHÔNG xoá gì cả. Muốn bật thì phải có người viết một con
# số vào đây, và con số đó là nghĩa vụ pháp lý của từng triển khai chứ không
# phải mặc định kỹ thuật ai đó đoán hộ. Cùng hình dạng với một lớp `days: null`:
# không có `days` nghĩa là không bao giờ bị quét.
#
# `months_ahead` là số tháng tạo sẵn. Phải lớn hơn khoảng cách giữa hai lượt
# bảo trì cộng thêm biên an toàn: nếu tháng mới chưa có partition, dòng ghi vào
# sẽ rơi xuống partition DEFAULT — không mất, nhưng partition DEFAULT thì không
# drop được, và chừng nào nó còn giữ dòng của một tháng thì partition tháng đó
# cũng không tạo được nữa.
audit:
  months_ahead: 3

  # Thời hạn đã QUYẾT, và từ 1.4.0 đã được PHÉP thi hành.
  #
  # `enforced` tách khỏi `days` vì hai thứ đó là hai trạng thái khác nhau, gộp
  # lại thì mất thông tin. `days: null` = "chưa ai quyết giữ bao lâu".
  # `enforced: false` (từng đứng ở đây) = "đã quyết, nhưng chưa được phép thi
  # hành" — vì DROP PARTITION xoá trọn một tháng, tức thì, không lùi được, và
  # bật một thao tác không hoàn tác được lên trên một mạng lưới an toàn chưa ai
  # thử là sai thứ tự.
  #
  # Điều kiện đó giờ đã đủ: scripts/backup_postgres.sh sao lưu off-box thật
  # (bucket dw-pg-backups), và
  # packages/python/dw_platform/tests/integration/test_restore_drill.py chạy
  # thật pg_dump -> pg_restore --clean --if-exists -> alembic heads trên hạ
  # tầng sống, không phải một quy trình viết ra rồi chưa ai bấm thử. Diễn tập
  # đó chứng minh cơ chế khôi phục TRONG CÙNG một cluster đang chạy — khôi
  # phục lên một host hoàn toàn mới, role tạo lại từ đầu, là một cuộc diễn tập
  # khác, lớn hơn, và chưa làm.
  enforced: true

  tables:
    # Ba năm. Thời hiệu khởi kiện tranh chấp thương mại là 2 năm (Luật Thương
    # mại Đ.319), kỳ soát xét nhìn lại 12 tháng — ba năm phủ cả hai kèm biên.
    #
    # Và đây là bảng CÓ dữ liệu cá nhân: `actor_id` nói ai làm gì lúc nào. Nghị
    # định 13/2023 yêu cầu xoá khi hết mục đích, nên giữ vô hạn KHÔNG phải là
    # phương án an toàn — nó là một vi phạm khác.
    audit_events:
      days: 1095
      description: Nhật ký kiểm toán — ai làm gì, lúc nào

# Checkpoint của run (`platform.run_checkpoints`, `run_checkpoint_writes`). Từ
# 1.6.0.
#
# Mỗi checkpoint giữ NGUYÊN VĂN toàn bộ danh sách message của thread tại bước
# đó, nên mỗi checkpoint cũ là một bản sao cũ của hội thoại — kể cả phần mà
# compaction đã gỡ khỏi trạng thái sống. Trước bản này không gì xoá chúng ngoài
# offboarding: một thread dài giữ mọi phiên bản của nó, mãi mãi.
#
# Hai thời hạn, vì hai thứ khác nhau hết cần:
# - `superseded_days`: checkpoint KHÔNG phải mới nhất của thread. Tiếp tục một
#   thread chỉ cần cái mới nhất; các cái cũ là lịch sử.
# - `idle_thread_days`: cả thread, kể cả cái mới nhất, khi không có gì ghi vào
#   nó lâu như vậy. Bằng lớp memory `default`: một hội thoại không ai đụng hai
#   năm là một hội thoại đã khép.
#
# Chỉ thread mà mọi run đã kết thúc (`completed`, `failed`, `cancelled`) mới bị
# chạm, số nào cũng vậy: một run đang chờ người duyệt resume từ chính các dòng
# này. 7 và 730 là số đề xuất của ticket compaction; đổi ở đây là đủ.
checkpoints:
  superseded_days: 7
  idle_thread_days: 730

# Trần mỗi lượt quét. Retention là kiểm soát dung lượng chứ không phải kiểm soát
# tính đúng: một dòng sống quá hạn thêm một giờ không hại ai, còn một lệnh DELETE
# ôm cả năm dữ liệu sẽ khoá bảng đúng lúc có người đang dùng. Quét chạy hàng giờ
# nên trần này thoát được 24 nghìn dòng mỗi ngày trên mỗi bảng.
batch_limit: 1000
