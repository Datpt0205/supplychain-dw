schema_version: "1.0"
policy_id: supply_chain_brief
policy_version: "1.0.0"

# Thứ tự các nhóm tín hiệu trong bản tin quản lý hằng ngày
# (GET /api/v1/supply-chain/daily-brief). Đây là PLATFORM DEFAULT: mỗi tenant
# tự sắp lại qua PUT /api/v1/supply-chain/brief-policy (platform.policy_overrides,
# cùng cơ chế với supply_chain_sla và supply_chain_approval_matrix).
#
# Chỉ được SẮP LẠI, không được BỎ: signal_order phải liệt kê mỗi tín hiệu đúng
# một lần (dw_supply_chain.brief_policy từ chối document thiếu hoặc lặp). Thứ tự
# là sở thích; giấu hẳn một nhóm, ví dụ nhóm cần leo thang, là một điểm mù.
#
# Mặc định: việc gấp và khó đảo ngược đứng trước (NCC im lặng tới mức cần leo
# thang, trễ SLA, case bị chặn, phê duyệt đang treo), rồi tới những việc chỉ
# cần theo dõi, cuối cùng là tin "vừa thay đổi trong 24 giờ" — thông tin,
# không phải việc cần làm.
signal_order:
  - update_escalation_due
  - sla_breached
  - case_blocked
  - approval_pending
  - manual_review
  - supplier_reported_delay
  - update_reminder_due
  - waiting_external
  - rework
  - waiting_on_us
  - changed_recently
