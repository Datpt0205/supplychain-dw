schema_version: "1.0"
policy_id: supply_chain_brief
policy_version: "1.1.0"

# Thứ tự các nhóm tín hiệu trong bản tin quản lý hằng ngày
# (GET /api/v1/supply-chain/daily-brief). Đây là PLATFORM DEFAULT: mỗi tenant
# tự sắp lại qua PUT /api/v1/supply-chain/brief-policy (platform.policy_overrides,
# cùng cơ chế với supply_chain_sla và supply_chain_approval_matrix).
#
# Chỉ được SẮP LẠI, không được BỎ: signal_order phải liệt kê mỗi tín hiệu đúng
# một lần (dw_supply_chain.brief_policy từ chối document thiếu hoặc lặp). Thứ tự
# là sở thích; giấu hẳn một nhóm, ví dụ nhóm cần leo thang, là một điểm mù.
#
# 1.1.0 (ticket 08 giai đoạn 1) thêm bốn nhóm Hồ sơ phát triển sản phẩm:
# quá hạn giai đoạn 1, chờ BGĐ duyệt, chờ trình ký, mẫu đã đánh giá hôm nay.
# Override của tenant lưu ở 1.0.0 vẫn hợp lệ: bốn nhóm này được đặt đúng chỗ của
# chúng trong bản này (ngay sau tín hiệu gần nhất đứng trước), mọi chỗ tenant đã
# chọn giữ nguyên (SupplyChainBriefPolicy.from_stored).
#
# Mặc định: việc gấp và khó đảo ngược đứng trước (NCC im lặng tới mức cần leo
# thang, trễ SLA, case bị chặn, phê duyệt đang treo), rồi tới những việc chỉ
# cần theo dõi, cuối cùng là tin: mẫu đã đánh giá hôm nay và "vừa thay đổi
# trong 24 giờ" — thông tin, không phải việc cần làm.
signal_order:
  - update_escalation_due
  - sla_breached
  - product_sla_breached
  - case_blocked
  - approval_pending
  - product_awaiting_bod
  - product_awaiting_signoff
  - manual_review
  - supplier_reported_delay
  - update_reminder_due
  - waiting_external
  - rework
  - waiting_on_us
  - sample_evaluated_today
  - changed_recently
