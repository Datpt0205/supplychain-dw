schema_version: "1.0"
policy_id: supply_chain_model_routes
policy_version: "1.13.0"
# Which model profile each Supply Chain model task runs on (ADR 0025 point 10;
# ticket ai-automation/06): reading a file (extract.<doc type>) or writing a
# draft (draft.<kind>, tickets ai-automation/07-12). 1.13.0 gates on the dataset
# with the supplier message, proposal list, sample round, bod submission, BM04,
# supplier confirmation terms, step 9 item coding (no model: each case asserts
# zero calls), step 10 purchase order (no model at all) cases, and steps 11 and
# 16's papers (ticket ai-automation/15): the proforma and commercial invoices
# and the bank's transfer receipt read (extract.*), and the PO steps code
# prepares from those readings (prepare.po_step, no model), and step 12's
# packaging design proof read (extract.packaging_design) and checked by code
# against the BM04 and the label rules (prepare.packaging, no model; ticket
# ai-automation/16), and steps 13-15's papers (ticket ai-automation/17): the
# production schedule, QC report, packing list, bill of lading, arrival notice
# and certificate of origin read (extract.*), steps 13-15 prepared by code
# (prepare.po_step), and the weekly production chase written
# (draft.supplier_message), and step 17 (ticket ai-automation/18): the
# warehouse's counts reconciled by code (prepare.po_step, no model) and the
# claim letter written (draft.supplier_message). A task with no route runs on
# the process's own profile (DW_WORKER_MODEL_PROFILE: luna for Elmich). A route to a profile not
# listed in ungated_profiles is refused when the worker starts unless that
# profile's LIVE run of the gate dataset passed the task
# (evals/gates/<profile>.json, written by scripts/model_gate.py).
ungated_profiles: [luna]
gate:
  dataset: supply_chain_preparation@1.13.0
  # Every case of the task, and never a security case failed.
  min_pass_rate: 1.0
routes: {}
