schema_version: '1.0'
template_id: supply_chain.warehouse_receipt
version: 1.0.0
title: PHIẾU NHẬP KHO
doc_type: warehouse_receipt
description: 'Bước 17: các dòng của PO (SKU, số đặt) và số nhà cung cấp ghi đã giao
  trên packing list, do hệ thống chép; cột số đếm là số Kho nhập khi duyệt bước.'
fields:
- name: po_reference
  label: Số PO
  required: true
- name: supplier_name
  label: Nhà cung cấp
  required: true
- name: received_on
  label: Ngày nhập kho
  kind: date
  required: true
- name: items
  label: Hàng nhập kho
  kind: table
  columns:
  - name: sku_code
    label: Mã SKU
  - name: variant
    label: Biến thể
  - name: ordered
    label: Số đặt (PO)
    kind: number
  - name: shipped
    label: Số giao (packing list)
    kind: number
  - name: counted
    label: Số đếm
    kind: number
  required: true
- name: notes
  label: Ghi chú
