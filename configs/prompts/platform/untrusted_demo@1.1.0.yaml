description: Prompt mẫu của platform — dữ liệu KHÔNG TIN CẬY được registry tự giam trong block <input> đã escape (từ 1.1.0 template không tự viết block). Giữ làm chuẩn cho mọi bounded context mới và làm mục tiêu cho eval prompt-injection.
