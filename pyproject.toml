[project]
name = "digital-worker-platform"
version = "0.1.0"
description = "Digital Worker platform: multi-tenant agent runtime, knowledge, memory and approvals. Business bounded contexts plug in as packages."
requires-python = ">=3.12"
license = { text = "Proprietary" }

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/docgen", "apps/worker", "packages/python/*"]

[tool.uv.sources]
dw-kernel = { workspace = true }
dw-platform = { workspace = true }
dw-agent-runtime = { workspace = true }
dw-knowledge = { workspace = true }
dw-memory = { workspace = true }
dw-connectors = { workspace = true }
dw-observability = { workspace = true }
dw-evals = { workspace = true }
dw-supply-chain = { workspace = true }
dw-api = { workspace = true }
dw-docgen = { workspace = true }
dw-worker = { workspace = true }
# Docling (the worker's optional `parsers` extra) pulls torch, whose default
# wheels bundle a multi-GB CUDA runtime. Document parsing runs fine on CPU, so
# pin the CPU-only build: far smaller and faster to install, and the only
# sensible default for a host with no GPU.
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=0.25,<2",
    "httpx>=0.28,<1",
    "import-linter>=2.1,<3",
    "pre-commit>=4.0,<5",
    "asgi-lifespan>=2.1,<3",
    "types-pyyaml>=6.0,<7",
    "pytest-cov>=6.0,<8",
    # Windows ships no IANA tz database, so `zoneinfo.ZoneInfo("UTC")` — which
    # `alembic revision` needs for `alembic.ini`'s `timezone = UTC` — raises
    # ZoneInfoNotFoundError with no other symptom. Linux containers already
    # carry system tzdata; this is a dev-machine gap only, found by actually
    # running `alembic revision`, not by reading alembic's docs.
    "tzdata>=2024.1",
]

# ---------------------------------------------------------------------------
# Ruff — lint + format for the whole Python workspace
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "packages/python/*/src",
    "apps/api/src",
    "apps/docgen/src",
    "apps/worker/src",
    "scripts",
]
# `vendor/` is third-party code pinned at a tag. Formatting it would make every
# re-vendor a conflict and every diff unreadable.
extend-exclude = ["db/migrations/versions", "vendor"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff-specific
    "TID", # tidy imports
]
ignore = [
    "SIM117", # nested with is sometimes clearer
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B011"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection markers are immutable sentinels used in defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]

[tool.ruff.lint.isort]
known-first-party = [
    "dw_kernel",
    "dw_platform",
    "dw_agent_runtime",
    "dw_knowledge",
    "dw_memory",
    "dw_connectors",
    "dw_observability",
    "dw_evals",
    "dw_api",
    "dw_supply_chain",
    "dw_docgen",
    "dw_worker",
]

# ---------------------------------------------------------------------------
# mypy — strict for src, relaxed-def for tests
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
# Pinned, not inferred. mypy narrows `sys.platform` to whatever machine it runs
# on, so a platform-guarded branch is live for one developer and unreachable for
# another — and with `warn_unreachable` that is not a difference of opinion, it
# is a typecheck that passes locally and fails in CI. Measured: every push was
# red on `runner.py` while mypy was green on Windows. Everything deployed runs
# in a Linux container, so that is the answer both should give.
platform = "linux"
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]
files = [
    "packages/python",
    "apps/api/src",
    "apps/docgen/src",
    "apps/worker/src",
    "scripts",
]
exclude = ['db/migrations/versions', 'tests/(unit|integration)/conftest\.py$']
mypy_path = [
    "packages/python/dw_kernel/src",
    "packages/python/dw_platform/src",
    "packages/python/dw_agent_runtime/src",
    "packages/python/dw_knowledge/src",
    "packages/python/dw_memory/src",
    "packages/python/dw_connectors/src",
    "packages/python/dw_observability/src",
    "packages/python/dw_evals/src",
    "packages/python/dw_supply_chain/src",
    "apps/api/src",
    "apps/docgen/src",
    "apps/worker/src",
    "tests/support",
    "packages/python/dw_platform/tests/integration",
    "packages/python/dw_agent_runtime/tests/integration",
    "packages/python/dw_agent_runtime/tests/unit",
    "packages/python/dw_supply_chain/tests/integration",
]
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["*.tests.*", "tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# asyncpg ships no py.typed marker. Used directly in exactly one place — the
# LISTEN connection, which cannot come from the SQLAlchemy pool.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
# `-p no:anyio`: async tests and fixtures have one runner, pytest-asyncio in
# auto mode. With anyio's plugin also loaded, the two `pytest_fixture_setup`
# wrappers race in plugin-registration order (the order of site-packages), and
# when anyio wins an async fixture runs on a loop that is not running while the
# test does: three LISTEN/NOTIFY tests timed out on the 2026-09-20 runner image.
# With the plugin off, `--strict-markers` turns any `pytest.mark.anyio` into a
# collection error instead of a race.
addopts = "-q --strict-markers -p no:anyio"
testpaths = [
    "packages/python",
    "apps/api/tests",
    "apps/docgen/tests",
    "apps/worker/tests",
]
pythonpath = [".", "tests/support", "packages/python/dw_agent_runtime/tests/integration"]
markers = [
    "unit: fast tests without external services",
    "integration: tests requiring Postgres/Qdrant/Redis/MinIO",
    "contract: API/event/tool schema contract tests",
    "e2e: end-to-end vertical slice tests",
    "eval: evaluation smoke/regression tests",
    "architecture: import-boundary and dependency-rule tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# ---------------------------------------------------------------------------
# coverage — measured on src, tests and migrations excluded. `fail_under` is a
# ratchet: it may only be raised, never lowered (target 85%).
# ---------------------------------------------------------------------------
[tool.coverage.run]
# Each src dir is listed separately: pointing at "packages/python" would drop
# never-imported modules under the <pkg>/src/ layout from the denominator.
source = [
    "packages/python/dw_agent_runtime/src",
    "packages/python/dw_connectors/src",
    "packages/python/dw_evals/src",
    "packages/python/dw_kernel/src",
    "packages/python/dw_knowledge/src",
    "packages/python/dw_memory/src",
    "packages/python/dw_observability/src",
    "packages/python/dw_platform/src",
    "apps/api/src",
    "packages/python/dw_supply_chain/src",
    "apps/docgen/src",
    "apps/worker/src",
]
omit = ["*/tests/*", "*/conftest.py", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = false
skip_covered = true
precision = 1
fail_under = 70

# ---------------------------------------------------------------------------
# import-linter — the architecture rules, enforced rather than documented.
#
# A business context added to this repo extends these lists in the same change
# that creates it: import-linter fails on a module that does not exist, so a
# contract can never be written ahead of the code it governs.
# ---------------------------------------------------------------------------
[tool.importlinter]
include_external_packages = true
root_packages = [
    "dw_kernel",
    "dw_platform",
    "dw_agent_runtime",
    "dw_knowledge",
    "dw_memory",
    "dw_connectors",
    "dw_observability",
    "dw_evals",
    "dw_supply_chain",
    "dw_api",
    "dw_worker",
]

[[tool.importlinter.contracts]]
# Contexts are independent: one importing another is a super-agent forming, and
# the second one is always where it starts. The platform may not import a
# context either — that direction is what keeps the skeleton reusable.
name = "Supply Chain is independent"
type = "forbidden"
source_modules = ["dw_supply_chain"]
forbidden_modules = ["dw_api", "dw_worker", "dw_docgen"]

[[tool.importlinter.contracts]]
# The other half of the comment above, which the scaffold's contract does not
# check on its own: a platform package reaching into a context is the platform
# becoming that product. `dw_evals` included: a context's graders live in the
# context (`<context>.testing.eval_graders`) and join the platform's in the eval
# composition root, `scripts/run_evals.py` (platform-runtime eval-grader-registry).
name = "Platform packages do not import a bounded context"
type = "forbidden"
source_modules = [
    "dw_kernel",
    "dw_platform",
    "dw_agent_runtime",
    "dw_knowledge",
    "dw_memory",
    "dw_connectors",
    "dw_observability",
    "dw_evals",
]
forbidden_modules = ["dw_supply_chain"]

[[tool.importlinter.contracts]]
name = "Kernel is pure (stdlib only)"
type = "forbidden"
source_modules = ["dw_kernel"]
forbidden_modules = [
    "pydantic",
    "fastapi",
    "sqlalchemy",
    "alembic",
    "langgraph",
    "langchain",
    "qdrant_client",
    "redis",
    "httpx",
    "boto3",
    "minio",
    "openai",
    "anthropic",
    "dw_platform",
    "dw_agent_runtime",
    "dw_knowledge",
    "dw_memory",
    "dw_connectors",
    "dw_observability",
    "dw_evals",
]

[[tool.importlinter.contracts]]
name = "Domain layers never import frameworks or providers"
type = "forbidden"
source_modules = ["dw_platform.domain", "dw_supply_chain.domain"]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "alembic",
    "langgraph",
    "langchain",
    "qdrant_client",
    "redis",
    "httpx",
    "boto3",
    "minio",
    "openai",
    "anthropic",
    "opentelemetry",
]

[[tool.importlinter.contracts]]
# A workflow node that imports a concrete adapter has a database session or a
# provider client in the middle of a graph — the shape that makes a node
# untestable without infrastructure and makes the tenant filter a node's
# business. Nodes take what they need by injection from the composition root.
#
# dw_agent_runtime.adapters is deliberately NOT forbidden: that is the runtime
# seam (chat model factory, checkpointer), and reaching it is how a node stays
# provider-agnostic rather than how it stops being one.
name = "LangGraph only inside runtime adapters"
type = "forbidden"
source_modules = [
    "dw_agent_runtime.contracts",
    "dw_agent_runtime.ports",
    "dw_agent_runtime.registry",
    "dw_agent_runtime.tools",
    "dw_agent_runtime.executor",
    "dw_agent_runtime.context",
    "dw_agent_runtime.model",
]
forbidden_modules = ["langgraph", "langchain_core", "langchain"]

[[tool.importlinter.contracts]]
name = "Vector/object-storage SDKs only inside knowledge adapters"
type = "forbidden"
source_modules = [
    "dw_knowledge.contracts",
    "dw_knowledge.ports",
    "dw_knowledge.gateway",
    "dw_knowledge.chunking",
    "dw_knowledge.tables",
    "dw_memory",
    "dw_platform",
    "dw_agent_runtime",
]
forbidden_modules = ["qdrant_client", "minio", "boto3"]
# The whole of `dw_memory` is the source, with the one legitimate import named
# here rather than by listing the modules that are NOT adapters — the way the
# knowledge half above does it. Listing is what let this contract go BROKEN on
# main for five CI runs: `dw_memory` was named as a package, the ranker adapter
# was added under it, and the choice was between deleting the rule and weakening
# it. Named this way, a new module under `dw_memory` is covered the day it is
# written, and a second provider import has to be argued for on this line.
ignore_imports = ["dw_memory.adapters.qdrant_ranker -> qdrant_client"]

[[tool.importlinter.contracts]]
# ADR 0014 / zalo-channel ticket 01: what the bot hears decides nothing on its
# own. The self-link flow links and unlinks a chat and replies; it cannot reach
# the approval service or build an access context. Since Z4 the update entry
# (`zalo_inbound`) and the inbound router (`dw_connectors.inbound`) are in it
# too: they hand a linked person's message to commands registered at the
# composition root, which receive a context the PLATFORM built from that
# person's own membership, cut to the command's ceiling (ADR 0012 condition 2).
# None of these modules can build one, read a scope or reach approvals — the
# router's context type is a parameter the composition root binds. Z5's decide
# command is registered the same way. The worker's poll lane is in it too,
# which is why `dw_worker` and `dw_api` are root packages: an app package left
# out of `root_packages` is one import-linter cannot see into.
name = "The Zalo link flow and inbound router cannot reach approvals or access contexts"
type = "forbidden"
source_modules = [
    "dw_connectors.adapters.zalo_link",
    "dw_connectors.adapters.zalo_bot",
    "dw_connectors.adapters.zalo_inbound",
    "dw_connectors.inbound",
    "dw_worker.consumers.zalo_poll",
]
forbidden_modules = ["dw_agent_runtime", "dw_platform", "dw_api"]

[[tool.importlinter.contracts]]
# The settings routes for the same link. Direct imports only: every route
# reaches the approval service and the access-context factory indirectly,
# through the composition root that `RequireAccessContext` resolves the caller
# with. What this forbids is the route itself taking either, so the caller is
# always the bearer token's user and never anything a chat sent.
name = "The Zalo settings routes take neither approvals nor the access-context factory"
type = "forbidden"
source_modules = ["dw_api.routes.v1.zalo"]
forbidden_modules = [
    "dw_agent_runtime",
    "dw_platform.application.identity",
    "dw_api.bootstrap",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Platform packages do not import app composition roots"
type = "forbidden"
source_modules = [
    "dw_kernel",
    "dw_platform",
    "dw_agent_runtime",
    "dw_knowledge",
    "dw_memory",
    "dw_connectors",
    "dw_observability",
]
forbidden_modules = ["dw_api", "dw_worker", "dw_docgen"]
